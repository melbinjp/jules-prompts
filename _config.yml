title: Jules Prompts
description: "Machine-readable task prompts for coding agents, including the failures agents actually have: broken setup scripts, vague issues, unreviewed agent PRs."
# Needed for absolute_url, which the canonical and og:url tags in _includes/head.html use.
url: https://jules-prompts.wecanuseai.com

collections:
  prompts:
    output: true
    layout: default
    sort_by: title

# Jekyll's default exclude list is REPLACED, not extended, when this key is set - so
# node_modules has to be named here or the whole tree gets copied into _site.
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - mcp
  - scripts
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - vendor
