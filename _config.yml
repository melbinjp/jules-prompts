title: Jules Prompts
# The description is what a results page and a link preview show, so it leads with the words
# people search for: what these are, and which agents read them.
description: "Free, open-source Agent Skills (SKILL.md) for Claude Code, Codex, Cursor, GitHub Copilot, Gemini CLI, Jules and any AI agent: take any idea, software or hardware, in any state, to a working product and keep it improving, with every decision backed by evidence, every change traced to the goal, and the experience designed and tested with people. Each skill ends in a verdict you can check."
author: Melbin J Paulose
# The link-preview card, made from scripts/og-image.html (see the comment at its top).
og_image: /assets/og.png
og_image_alt: "Jules Prompts. Take any idea all the way, and keep it working. An expected report reading 3 holds, 8 broken, 0 skipped of 11 items."
# Needed for absolute_url, which the canonical and og:url tags in _includes/head.html use.
url: https://jules-prompts.wecanuseai.com

# WHY A SITEMAP, measured rather than assumed. Search is the only channel strangers actually
# arrive through - the repository's own traffic for the fortnight to 2026-08-21 reads Google
# 10 views from 2 uniques and perplexity.ai 5 from 1, against 2 from GitHub itself. And on
# that date the site served no /sitemap.xml and no /robots.txt at all, so nineteen prompt
# pages were reachable only by crawling links from the index.
#
# `jekyll-sitemap` is on the GitHub Pages plugin allowlist and this repository uses the
# default Pages build with no Gemfile, so it needs no other change. Per-page titles,
# descriptions and canonicals already exist by hand in `_includes/head.html`; what was
# missing was telling a crawler the pages are there.
plugins:
  - jekyll-sitemap

collections:
  # The procedures, one page each, at /prompts/<name>.html.
  prompts:
    output: true
    sort_by: title
  # Each SKILL.md, served verbatim at /.well-known/agent-skills/<name>/SKILL.md. Generated
  # by scripts/emit.py; see emit_agent_skills for why they are wrapped rather than copied.
  agent_skills:
    output: true

# The stylesheet is shipped compressed: every visitor downloads it, and nobody reads the output.
# The source (assets/css/style.scss) keeps its comments and layout.
sass:
  style: compressed

# Jekyll skips dot-directories. The Agent Skills discovery index lives in one.
include:
  - .well-known

# Jekyll's default exclude list is REPLACED, not extended, when this key is set - so
# node_modules has to be named here or the whole tree gets copied into _site.
#
# plugin/ is excluded because Jekyll rendered every SKILL.md and command in it as a bare HTML
# fragment (no layout, no styles) and listed all fifty in the sitemap. The skills are served
# from /.well-known/agent-skills/ instead, verbatim.
exclude:
  - node_modules
  - package.json
  - package-lock.json
  - mcp
  - scripts
  - skills
  - plugin
  - fixtures
  # A worked example of a project's ledger. Its decision records have front matter, so Jekyll
  # would render each one as a bare page; it is read on GitHub instead.
  - harness/ledger-example
  # Short forms of the skills, for local models; read from a clone, not the site.
  - compact
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - vendor
