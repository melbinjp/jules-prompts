<!-- ============================================================
     Site Header — nav, theme toggle, mobile hamburger
     ============================================================ -->
<header class="site-header">
  <div class="header-inner">

    <!-- Brand / Logo -->
    <a href="{{ '/' | relative_url }}" class="site-brand" aria-label="Home">
      <svg class="brand-icon" width="28" height="28" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="currentColor"/>
        <path d="M36 8L18 36h10L24 56l22-32H34L36 8z" fill="#fff"/>
      </svg>
      <span class="brand-text">Jules Prompts</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="nav-links" aria-label="Primary navigation">
      <a href="{{ '/' | relative_url }}" class="nav-link">Home</a>
      <a href="{{ '/prompts-guide/' | relative_url }}" class="nav-link">Prompts Guide</a>
      <a href="{{ '/workflow/' | relative_url }}" class="nav-link">Workflow</a>
    </nav>

    <!-- Right‑side controls -->
    <div class="header-actions">

      <!-- Theme toggle (moon → dark, sun → light) -->
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode" type="button">
        <!-- Moon icon (shown in light mode) -->
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <!-- Sun icon (shown in dark mode) -->
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>

      <!-- Mobile hamburger menu button -->
      <button id="menu-toggle" class="hamburger" aria-label="Open menu" aria-expanded="false" type="button">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </div>
</header>
