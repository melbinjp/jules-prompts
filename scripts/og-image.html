<!DOCTYPE html>
<!--
  The link-preview card (assets/og.png): what a chat app, a social post or a search result shows
  when someone shares a link to the site. It uses the site's own tokens and system font, and the
  result line is the flagship fixture's expected report, the same one the home page shows.

  After changing it, render it again at exactly 1200 by 630:

    npx playwright screenshot --viewport-size "1200, 630" --wait-for-timeout 500 \
      "file://$PWD/scripts/og-image.html" assets/og.png

  scripts/check_site.py fails if the card is missing or is not 1200 by 630.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jules Prompts link preview</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1200px;
    height: 630px;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    background: #ffffff;
    color: #1a1c1f;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, Arial, sans-serif;
  }
  .brand { display: flex; align-items: baseline; font-size: 30px; font-weight: 650; }
  .brand small { margin-left: auto; color: #565b63; font-size: 22px; font-weight: 400; }
  h1 {
    margin: auto 0 0;
    max-width: 24ch;
    font-size: 70px;
    line-height: 1.12;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  .result { display: flex; gap: 28px; margin: 36px 0 0; padding-top: 28px; border-top: 2px solid #d5d8dc; font-size: 26px; font-weight: 600; }
  .result span::before {
    content: "";
    display: inline-block;
    width: 14px;
    height: 14px;
    margin-right: 10px;
    border-radius: 3px;
    background: currentColor;
  }
  .holds { color: #1b7a3d; }
  .broken { color: #bd2a1d; }
  .skipped { color: #875b00; }
  .of { color: #565b63; font-weight: 400; }
  .of::before { display: none !important; }
</style>
</head>
<body>
  <div class="brand">
    Jules Prompts
    <small>Agent Skills for any agent</small>
  </div>
  <h1>Take any idea all the way, and keep it working.</h1>
  <p class="result">
    <span class="holds">3 holds</span>
    <span class="broken">8 broken</span>
    <span class="skipped">0 skipped</span>
    <span class="of">of 11 items, from one skill's report</span>
  </p>
</body>
</html>
