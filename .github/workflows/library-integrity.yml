name: Library integrity

# The prompt set, PROMPTS_GUIDE.md and workflow.json are three views of one library, and the
# README asks for them to stay aligned. They had already drifted once. This makes the rule
# checkable instead of remembered.
#
# Deliberately has no `continue-on-error` and no step that swallows an exit code: a check that
# cannot fail is indistinguishable from one that was never run.
#
# And no path filter on pull requests. The old one listed the paths someone thought mattered;
# mcp/ was not among them, so a pull request that changed only the MCP server ran no checks at
# all. A gate that a path filter can skip is not a gate, and this workflow takes about a minute.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: The library must agree with itself
        run: python scripts/check_library_integrity.py

      - name: Every generated form must still match its source
        run: python scripts/emit.py --check

  site:
    # The repository agreeing with itself says nothing about what the site serves. This builds
    # the site with the same action and versions GitHub Pages uses, then checks the output: that
    # every SKILL.md is served byte for byte with the digest the discovery index states, that
    # llms.txt resolves, and that every page is whole, titled and loads nothing from elsewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the site as GitHub Pages does
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: The site must serve what it claims
        run: python scripts/check_site.py _site

  mcp:
    # The server has to actually speak MCP, not merely parse. This starts it, runs a real
    # initialize / prompts/list / prompts/get exchange over stdio, and checks the argument is
    # substituted. It reads the repository at the commit under test, so a pull request is
    # checked against its own procedures rather than main's.
    runs-on: ubuntu-latest
    env:
      JULES_PROMPTS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: The MCP server must answer a real client
        run: node mcp/smoke-test.mjs
