name: Library integrity

# The prompt set, workflow.json, the generated skills and the fixtures are views of one library.
# They had already drifted once. This makes the rule checkable instead of remembered.
#
# Deliberately has no `continue-on-error` and no step that swallows an exit code: a check that
# cannot fail is indistinguishable from one that was never run.
#
# And no path filter on pull requests. The old one listed the paths someone thought mattered;
# mcp/ was not among them, so a pull request that changed only the MCP server ran no checks at
# all. A gate that a path filter can skip is not a gate, and this workflow takes about a minute.
#
# Actions are pinned to the commit their tag pointed at when pinned, so a moved tag cannot change
# what runs here. The comment names the tag, for updating.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: The library must agree with itself
        run: python scripts/check_library_integrity.py

      - name: Every generated form must still match its source
        run: python scripts/emit.py --check

      # The ledger check other projects copy into their CI. Each rule is broken once on purpose
      # and must be caught; the worked example must pass.
      - name: The ledger check must catch every way of breaking a ledger
        run: python scripts/test_check_trace.py

      # A model builds its own agent harness from the run-autonomously skill, and it is ready when
      # harness/conformance.py passes against it. This proves the conformance test itself: it
      # must pass a reference harness, and fail each of twelve copies with one property broken.
      - name: The harness conformance test must tell a good harness from a broken one
        run: python scripts/test_conformance.py

  site:
    # The repository agreeing with itself says nothing about what the site serves. This builds
    # the site with the same action and versions GitHub Pages uses, then checks the output: that
    # every SKILL.md is served byte for byte with the digest the discovery index states, that
    # llms.txt resolves, and that every page is whole, titled and loads nothing from elsewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the site as GitHub Pages does
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: The site must serve what it claims
        run: python scripts/check_site.py _site

  mcp:
    # The server has to actually speak MCP, not merely parse. This starts it, runs a real
    # initialize / prompts/list / prompts/get exchange over stdio, and checks the argument is
    # substituted. It reads the repository at the commit under test, so a pull request is
    # checked against its own procedures rather than main's.
    runs-on: ubuntu-latest
    env:
      JULES_PROMPTS_REF: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      # The server's dependencies were carrying one high and two moderate advisories, pulled in
      # by the SDK's HTTP transports. A new high one fails the build rather than waiting to be
      # noticed.
      - name: No known high-severity vulnerabilities in what the server ships
        run: npm audit --omit=dev --audit-level=high

      - name: The MCP server must answer a real client
        run: node mcp/smoke-test.mjs

      # Private and offline projects run the server from a copy on disk. In that mode it replaces
      # fetch with one that throws, so this also proves it served everything with no network.
      - name: The MCP server must answer from a local copy, with no network
        run: node mcp/smoke-test.mjs
        env:
          JULES_PROMPTS_DIR: .
