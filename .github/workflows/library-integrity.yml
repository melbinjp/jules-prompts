name: Library integrity

# The prompt set, PROMPTS_GUIDE.md and workflow.json are three views of one library, and the
# README asks for them to stay aligned. They had already drifted once. This makes the rule
# checkable instead of remembered.
#
# Deliberately has no `continue-on-error` and no step that swallows an exit code: a check that
# cannot fail is indistinguishable from one that was never run.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '_prompts/**'
      - 'skills/**'
      - 'fixtures/**'
      - 'harness/**'
      - 'PROMPTS_GUIDE.md'
      - 'workflow.json'
      - 'scripts/check_library_integrity.py'
      - 'scripts/emit.py'
      - 'plugin/**'
      - 'library.json'
      - '**/*.md'
      - 'scripts/generate_skills.py'
      - 'scripts/score_fixture.py'
      - '.github/workflows/library-integrity.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: The library must agree with itself
        run: python scripts/check_library_integrity.py


      - name: Every generated form must still match its source
        run: python scripts/emit.py --check

  mcp:
    # The server has to actually speak MCP, not merely parse. This starts it, runs a real
    # initialize / prompts/list / prompts/get exchange over stdio, and checks the argument is
    # substituted. It reaches the live index on purpose: a server that serves a stale or empty
    # list is the failure worth catching, and only an end-to-end call sees it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci || npm install

      - name: The MCP server must answer a real client
        run: node mcp/smoke-test.mjs
