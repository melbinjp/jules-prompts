name: Library integrity

# The conductor, its generated forms, its regression fixtures and the harness that stays are views
# of one repository. They had already drifted once. This makes the rule checkable instead of
# remembered. Which check protects which behaviour is in docs/migration/checks.md.
#
# Deliberately has no `continue-on-error` and no step that swallows an exit code: a check that
# cannot fail is indistinguishable from one that was never run.
#
# And no path filter on pull requests. The old one listed the paths someone thought mattered, and
# a pull request that changed only a path it missed ran no checks at all. A gate that a path
# filter can skip is not a gate, and this workflow takes about a minute.
#
# Actions are pinned to the commit their tag pointed at when pinned, so a moved tag cannot change
# what runs here. The comment names the tag, for updating.

on:
  push:
    branches: [main, m/brave-shannon-e884k9]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the coverage map is checked against the preserved migration baseline

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: The repository must agree with itself
        run: python scripts/check_library_integrity.py

      - name: The conductor package must be complete and its references must resolve
        run: python scripts/check_conductor.py

      - name: The conductor check must reject broken installations and references
        run: python scripts/test_check_conductor.py

      # A date in a schedule with no source must fail, and a sourced schedule must pass.
      # The planted case is fixtures/premature-start. A check that is not in this job can be skipped.
      - name: An unsourced schedule date must fail, and a sourced one must pass
        run: python scripts/test_check_time_limits.py

      - name: Every generated form must still match conductor/
        run: python scripts/emit.py --check

      - name: Generated bytes and the archive must be reproducible
        run: python scripts/test_emit_bytes.py

      - name: Trial preparation preserves interrupted work
        run: python scripts/test_trial_prep.py

      - name: Every migration mapping resolves
        run: python scripts/inventory_map.py --destinations

      # The ledger check other projects copy into their CI, kept for projects that still keep the
      # ledger. Each rule is broken once on purpose and must be caught; the worked example must pass.
      - name: The ledger check must catch every way of breaking a ledger
        run: python scripts/test_check_trace.py

      # A model can build its own agent harness, and it is ready when harness/conformance.py passes
      # against it. This proves the conformance test itself: it must pass a reference harness, and
      # fail each of twelve copies with one property broken.
      - name: The harness conformance test must tell a good harness from a broken one
        run: python scripts/test_conformance.py

  site:
    # The repository agreeing with itself says nothing about what the site serves. This builds
    # the site with the same action and versions GitHub Pages uses, then checks the output: that
    # the archive and every file of the conductor are served byte for byte with the digests the
    # index and llms.txt state, that every retired address lands somewhere, and that every page is
    # whole, titled and loads nothing from elsewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the site as GitHub Pages does
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: The site must serve what it claims
        run: python scripts/check_site.py _site
