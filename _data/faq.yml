# The home page's questions. Rendered as HTML on the page and as FAQPage structured data in
# its head, from this one list, so the two cannot disagree. Answers may use inline HTML.
- q: What is an Agent Skill?
  a: A folder with a <code>SKILL.md</code> file in it. The file starts with a name and a one-line description of when to use it, and the procedure follows. An agent that supports skills reads the descriptions and loads the one that matches the task. Claude Code, Codex, GitHub Copilot, Cursor and Gemini CLI all read the format.
- q: Which agents can use these?
  a: Any agent that can read a file or fetch a URL. Install them as skills where the agent supports them, point it at <a href="/llms.txt">llms.txt</a>, add the MCP server to get them as slash commands, or paste the text. Nothing in them depends on one product's tool names.
- q: Is this affiliated with Google or Jules?
  a: No. The library started in 2025 as prompts for Jules, Google's coding agent, which is where the name comes from. The skills work with Jules and with every other agent.
- q: What does it cost?
  a: Nothing. Everything is MIT licensed, there is nothing to sign up for, and the site has no analytics, cookies or trackers.
- q: Can an agent that controls hardware use them?
  a: Yes. <a href="/prompts/task_act_on_the_physical_world.html">Act on the Physical World, and Prove It Happened</a> is for any command that moves, heats, dispenses, spends or sends. It confirms the result through an independent measurement rather than the device's acknowledgement, and sends every failure to a safe state decided in advance.
- q: Can it start a project from nothing but an idea?
  a: Yes. <a href="/prompts/task_start_from_an_idea.html">Start a Project from an Idea</a> first works out what it takes to make it happen, from who needs it and what already exists to build on, to what it costs and the routes to pay for it. It then writes down what success is and the next route for when the first one is blocked, and makes the few decisions that are costly to reverse with verified evidence. It never concludes that an idea cannot be done. It turns every stage of the pipeline into a command a person or an agent can run, so the project can be run by hand, fully automated or anything between. Then it builds one thin slice end to end. It works the same for hardware.
- q: My project already exists, or it stalled. Where do I start?
  a: Where its state says, on the path every project shares. A prototype, a half-built or vibe-coded build, an inherited codebase or a working product with gaps is first founded again on paper, so everything already there gets its reason or is marked for revisiting, and then taken to production. A live, stalled or drifting project starts with <a href="/prompts/task_keep_it_on_course.html">Keep a Project on Course and Improving</a>, which finds the next route to the same goal. The first section of this page lists every starting state.
- q: Does it cover design, or only code?
  a: Design too. <a href="/prompts/task_design_the_experience.html">Design the Experience, with Evidence</a> starts from the people and their situation, designs every journey as a flow with every state and every word, keeps one system of look and behaviour in code, and makes every action operable by a person, an agent or automation with the same limits. It keeps the design threaded to the architecture, so what it promises can be built, and tests each journey with people. It works for screens, command lines, APIs, voices and devices.
- q: How does it keep a project from drifting?
  a: Every decision and every commit says which goal or measure it serves, in a ledger kept in the project, and a check in its CI refuses anything that serves nothing. <a href="/prompts/task_change_with_a_reason.html">Change a Project with a Reason</a> turns vague requests like "make it scalable" into measured changes, or a no with the number. <a href="/prompts/task_keep_it_on_course.html">Keep a Project on Course and Improving</a> takes every measure again at each milestone and continuously after launch, and ranks the next improvements.
- q: Can it be used offline, or on a private project?
  a: Yes. The skills are plain files that need no network. Install them from a copy of the repository, run the MCP server from that copy with the network refused, and give small local models the short forms in <code>compact/</code>. <a href="/prompts/task_keep_it_confidential.html">Keep a Project Confidential, Offline First</a> keeps the project's own code, data and plans from leaving through its tools, proves the pipeline runs with the network off, and sets how the internet is used when it must be. No skill assumes a hosted service.
- q: Can one model and one person build a project with this, on its own?
  a: Yes. <a href="/prompts/task_run_autonomously.html">Run a Project Autonomously</a> has the model build its own agent harness and tools if it has none, and prove them against a test the library supplies. It asks the person everything only they can answer at the start, then develops without waiting. It is safe because of a sandbox, checkpoints and limits set in advance, and correct because nothing counts as done until its tests, measures and a fresh review pass.
